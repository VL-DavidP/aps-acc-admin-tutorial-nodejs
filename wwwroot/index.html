<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ACC Admin · Live</title>
    <link rel="stylesheet" href="/main.css">
    <script src="/csv.js" defer></script>
    <script src="/main.js" defer></script>
</head>
<body>
    <header><div><span class="brand">ACC / ADMIN</span><span id="mode" class="badge">LIVE AUTODESK</span></div><button id="login">Sign in with Autodesk</button></header>
    <div id="notice" role="status" aria-live="polite" hidden></div>
    <div class="layout">
        <aside>
            <p class="eyebrow">WORKSPACE</p>
            <label>Autodesk account<select id="account"><option value="">Sign in to load accounts</option></select></label>
            <label>Data region<select id="region"><option value="US">US</option><option value="EMEA">Europe</option><option value="AUS">Australia</option></select></label>
            <nav aria-label="Main navigation">
                <button data-view="projects" class="active">Projects</button>
                <button data-view="members">Project members</button>
                <button data-view="reports">Account reports</button>
                <button data-view="presets">Setup presets</button>
                <button data-view="history">Import history</button>
            </nav>
            <div class="aside-note">Project setup and access,<br>in one place.<p>Changes are sent to your selected Autodesk account.</p></div>
        </aside>
        <main id="content"><p class="eyebrow">AUTODESK CONSTRUCTION CLOUD</p><h1>Less repetition.<br>More project work.</h1><p>Sign in to browse projects, prepare imports, and manage project access.</p></main>
    </div>
    <dialog id="dialog"><div class="dialog-head"><h2 id="dialogTitle"></h2><button id="closeDialog" aria-label="Close dialog">Close</button></div><div id="dialogNotice" role="alert" hidden></div><div id="dialogBody"></div></dialog>
</body>
</html>
